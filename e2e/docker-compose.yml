services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks: [irgsh]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  chief:
    image: irgsh-e2e
    command: irgsh-chief
    environment:
      IRGSH_CONFIG_PATH: /etc/irgsh/config.yaml
    volumes:
      - /tmp/irgsh-e2e/config.yaml:/etc/irgsh/config.yaml:ro
      - chief:/tmp/irgsh-e2e/chief
      - gnupg:/tmp/irgsh-e2e/gnupg
    ports:
      - "127.0.0.1:8080:8080"
    networks: [irgsh]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/version"]
      interval: 3s
      timeout: 3s
      retries: 10

  repo:
    image: irgsh-e2e
    command: ["irgsh-repo", "--config", "/etc/irgsh/config.yaml"]
    environment:
      IRGSH_CONFIG_PATH: /etc/irgsh/config.yaml
      GNUPGHOME: /tmp/irgsh-e2e/gnupg
    volumes:
      - /tmp/irgsh-e2e/config.yaml:/etc/irgsh/config.yaml:ro
      - repo:/tmp/irgsh-e2e/repo
      - gnupg:/tmp/irgsh-e2e/gnupg
    ports:
      - "127.0.0.1:8082:8082"
    networks: [irgsh]
    depends_on:
      chief:
        condition: service_healthy

networks:
  irgsh:

volumes:
  chief:
  repo:
    name: e2e_repo
  gnupg:
    name: e2e_gnupg
