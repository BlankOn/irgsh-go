name: E2E tests

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:00 GMT+7 (20:00 UTC)
    - cron: "0 20 * * *"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Notify Telegram (start)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="Oh Boy! it's 3AM
          E2E nightly run starting...
          Repo: ${{ github.repository }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}" || echo "Telegram notification failed"

      - name: Provision disposable native builder
        run: |
          sudo apt-get update
          sudo apt-get install -y -t noble-backports sbuild mmdebstrap uidmap dpkg-dev devscripts ca-certificates debian-archive-keyring
          for table in /etc/subuid /etc/subgid; do
            awk -F: '$2 < 589824 && $2 + $3 > 524288 { conflict=1 } END { exit conflict }' "$table"
          done
          sudo useradd --create-home --user-group --shell /bin/bash -K SUB_UID_COUNT=0 -K SUB_GID_COUNT=0 irgsh-builder-e2e
          sudo usermod --add-subuids 524288-589823 --add-subgids 524288-589823 irgsh-builder-e2e
          sudo install -d -m 0755 -o "$(id -un)" -g "$(id -gn)" /tmp/irgsh-e2e
          sudo install -d -m 0755 -o irgsh-builder-e2e -g irgsh-builder-e2e /tmp/irgsh-e2e/builder

      - name: Check native supervisor
        run: |
          bash e2e/scripts/native-builder_test.sh
          bash e2e/scripts/sbuild-config_test.sh

      - name: Run e2e tests
        run: ./e2e/run.sh

      - name: Dump service logs
        if: failure()
        run: cd e2e && docker compose logs --tail=200

      - name: Cleanup
        if: always()
        run: ./e2e/run.sh --cleanup

      - name: Notify Telegram (done)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            RESULT="[PASSED]"
          else
            RESULT="[FAILED]"
          fi
          MSG="${RESULT} E2E nightly run finished
          Repo: ${{ github.repository }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}" || echo "Telegram notification failed"
